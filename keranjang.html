<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumidoll - Keranjang</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #FAF0D7; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 2px solid #8B5A2B; position: sticky; top: 0; background: #FAF0D7; z-index: 100; }
        nav ul { display: flex; list-style: none; gap: 10px; }
        nav ul li a { text-decoration: none; color: #8B5A2B; font-weight: 600; font-size: 13px; padding: 8px 12px; border-radius: 20px; transition: 0.3s; }
        nav ul li a:hover { background-color: #8B5A2B; color: #fff; }
        .cart-trigger { background: #ee4d2d; color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .page-content { margin: 20px 0; padding: 30px; background: #fff; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .split-layout { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        .cart-box, .form-box { background: #fdfdfd; padding: 20px; border: 1px solid #eee; border-radius: 10px; }
        .cart-item-row { display: flex; flex-direction: column; gap: 8px; padding: 15px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .cart-item-header { display: flex; justify-content: space-between; font-weight: bold; color: #444; }
        .cart-item-actions { display: flex; justify-content: space-between; align-items: center; }
        .total-summary { margin-top: 15px; border-top: 2px solid #8B5A2B; padding-top: 10px; font-weight: bold; font-size: 18px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 4px; font-weight: bold; color: #666; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .btn-buy { background: #ee4d2d; color: white; border: none; padding: 8px 12px; border-radius: 3px; font-weight: bold; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .btn-buy:hover { background: #d73a1e; }
        .btn-download { background: #28a745; color: white; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .qty-input { display: flex; align-items: center; gap: 5px; }
        .qty-btn { background: #f8f8f8; border: 1px solid #ddd; width: 25px; height: 25px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #invoice { display: none; background: white; padding: 30px; border: 2px solid #333; max-width: 400px; margin: 20px auto; font-family: 'Courier New', Courier, monospace; }
        .success-msg { color: #28a745; font-weight: bold; text-align: center; margin-bottom: 10px; font-size: 18px; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <nav>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="katalog.html">KATALOG</a></li>
                <li><a href="tentang.html">TENTANG</a></li>
                <li><a href="kontak.html">KONTAK</a></li>
                <li><a href="lokasi.html">LOKASI</a></li>
            </ul>
        </nav>
        <button class="cart-trigger" onclick="location.href='keranjang.html'">
            🛒 KERANJANG (<span id="cart-count">0</span>)
        </button>
    </header>
    <div class="page-content" id="cartPageContent"></div>
</div>

<script>
    let currentCart = [];

    function loadCart() {
        currentCart = JSON.parse(localStorage.getItem('cart') || '[]');
        updateCartCount();
        renderCartPage();
    }

    function saveCartAndSync() {
        localStorage.setItem('cart', JSON.stringify(currentCart));
        updateCartCount();
        renderCartPage();
    }

    function updateCartCount() {
        const total = currentCart.reduce((sum, item) => sum + item.qty, 0);
        const span = document.getElementById('cart-count');
        if (span) span.innerText = total;
    }

    function changeCartQty(id, delta) {
        const idx = currentCart.findIndex(item => item.id === id);
        if (idx !== -1) {
            currentCart[idx].qty += delta;
            if (currentCart[idx].qty <= 0) currentCart.splice(idx, 1);
            saveCartAndSync();
        }
    }

    function removeCartItem(id) {
        currentCart = currentCart.filter(item => item.id !== id);
        saveCartAndSync();
    }

    function renderCartPage() {
        const container = document.getElementById('cartPageContent');
        if (!container) return;
        if (currentCart.length === 0) {
            container.innerHTML = `<div class="cart-box"><p style="color:#999;">Keranjang masih kosong... <a href="katalog.html">Belanja sekarang</a></p></div>`;
            return;
        }
        let total = 0;
        const itemsHtml = currentCart.map(item => {
            const subtotal = item.price * item.qty;
            total += subtotal;
            return `
                <div class="cart-item-row">
                    <div class="cart-item-header"><span>${item.name}</span><span style="color:#ee4d2d;">Rp${subtotal.toLocaleString()}</span></div>
                    <div class="cart-item-actions">
                        <span style="font-size:12px;">Rp${item.price.toLocaleString()}/pcs</span>
                        <div class="qty-input">
                            <button class="qty-btn" onclick="changeCartQty(${item.id}, -1)">-</button>
                            <input type="number" value="${item.qty}" readonly style="width:40px; text-align:center;">
                            <button class="qty-btn" onclick="changeCartQty(${item.id}, 1)">+</button>
                            <button onclick="removeCartItem(${item.id})" style="color:red; background:none; border:none; cursor:pointer; margin-left:10px;">🗑️</button>
                        </div>
                    </div>
                </div>`;
        }).join('');
        
        container.innerHTML = `
            <div class="split-layout" id="checkoutLayout">
                <div class="cart-box">
                    <h2 style="margin-bottom:15px; color:#ee4d2d;">🛒 Detail Keranjang</h2>
                    <div id="cart-items-list">${itemsHtml}</div>
                    <div class="total-summary"><div style="display:flex; justify-content:space-between;"><span>Total Belanja:</span><span>Rp${total.toLocaleString()}</span></div></div>
                </div>
                <div class="form-box">
                    <h3 style="margin-bottom:15px;">📝 Data Pengiriman</h3>
                    <form id="orderForm">
                        <div class="form-group"><label>Nama Lengkap</label><input type="text" id="custName" value="Wike Arnila" required></div>
                        <div class="form-group"><label>Metode Pembayaran</label><select id="payMethod"><option>Transfer Bank</option><option>COD</option><option>E-Wallet</option></select></div>
                        <div class="form-group"><label>Alamat Lengkap</label><textarea id="address" rows="3" required></textarea></div>
                        <button type="submit" class="btn-buy" style="width:100%; padding:15px; font-size:16px;">BUAT PESANAN SEKARANG</button>
                    </form>
                </div>
            </div>
            <div id="invoice"></div>`;
        
        document.getElementById('orderForm').onsubmit = (e) => { e.preventDefault(); processOrder(); };
    }

    function processOrder() {
        const name = document.getElementById('custName').value;
        const pay = document.getElementById('payMethod').value;
        const address = document.getElementById('address').value;
        const invNum = Math.floor(Math.random() * 9000) + 1000;
        const date = new Date().toLocaleString();
        
        let subtotal = currentCart.reduce((s, i) => s + i.price * i.qty, 0);
        let pajak = subtotal * 0.1;
        let total = subtotal + pajak;
        
        let itemsText = currentCart.map(i => `${i.name} x${i.qty} = Rp${(i.price*i.qty).toLocaleString()}`).join('\n');
        let itemsHtml = currentCart.map(i => `<p>${i.name} x${i.qty} = Rp${(i.price*i.qty).toLocaleString()}</p>`).join('');

        const receiptContent = `
LUMIDOLL PREMIUM STORE
---------------------------
ID INVOICE: INV-${invNum}
Tanggal   : ${date}
Pelanggan : ${name}
Alamat    : ${address}
Pembayaran: ${pay}
---------------------------
DETAIL PESANAN:
${itemsText}
---------------------------
Subtotal  : Rp${subtotal.toLocaleString()}
Pajak 10% : Rp${pajak.toLocaleString()}
TOTAL     : Rp${total.toLocaleString()}
---------------------------
Terima kasih telah belanja!
        `;

        const invoiceDiv = document.getElementById('invoice');
        document.getElementById('checkoutLayout').style.display = 'none';
        invoiceDiv.style.display = 'block';
        
        invoiceDiv.innerHTML = `
            <div class="success-msg">✔ PEMBAYARAN BERHASIL</div>
            <center><h3>LUMIDOLL STORE</h3><p>INV-${invNum}</p><p>***************************</p></center>
            <p style="font-size:12px;">Tgl: ${date}</p><p>Nama: ${name}</p><p>Bayar: ${pay}</p><hr>${itemsHtml}<hr>
            <p>Subtotal: Rp${subtotal.toLocaleString()}</p><p>Pajak 10%: Rp${pajak.toLocaleString()}</p><p><strong>TOTAL: Rp${total.toLocaleString()}</strong></p>
            <p>***************************</p>
            <button class="btn-download" id="downloadBtn">📥 DOWNLOAD STRUK (.TXT)</button>
            <button class="btn-buy" onclick="location.href='index.html'" style="width:100%; margin-top:10px;">Tutup</button>
        `;

        document.getElementById('downloadBtn').onclick = () => {
            const blob = new Blob([receiptContent], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Struk_Lumidoll_INV-${invNum}.txt`;
            link.click();
        };

        currentCart = [];
        localStorage.setItem('cart', JSON.stringify(currentCart));
        updateCartCount();
    }

    window.onload = loadCart;
</script>
</body>
</html>
