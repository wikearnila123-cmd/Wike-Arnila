<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumidoll - Kontak</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #FAF0D7; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 2px solid #8B5A2B; position: sticky; top: 0; background: #FAF0D7; z-index: 100; }
        nav ul { display: flex; list-style: none; gap: 10px; }
        nav ul li a { text-decoration: none; color: #8B5A2B; font-weight: 600; font-size: 13px; padding: 8px 12px; border-radius: 20px; transition: 0.3s; }
        nav ul li a:hover, nav ul li a.active { background-color: #8B5A2B; color: #fff; }
        .cart-trigger { background: #ee4d2d; color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        .page-content { margin: 40px 0; padding: 30px; background: #fff; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .promo-label { font-size: 22px; color: #8B5A2B; margin-bottom: 20px; border-left: 5px solid #ee4d2d; padding-left: 10px; }
        .split-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .contact-info, .contact-form { background: #fdfdfd; padding: 20px; border: 1px solid #eee; border-radius: 10px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 4px; font-weight: bold; color: #666; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .btn-buy { background: #ee4d2d; color: white; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-buy:hover { background: #d73a1e; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <nav>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="katalog.html">KATALOG</a></li>
                <li><a href="tentang.html">TENTANG</a></li>
                <li><a href="kontak.html" class="active">KONTAK</a></li>
                <li><a href="lokasi.html">LOKASI</a></li>
            </ul>
        </nav>
        <button class="cart-trigger" onclick="location.href='keranjang.html'">
            🛒 KERANJANG (<span id="cart-count">0</span>)
        </button>
    </header>

    <div class="page-content">
        <h2 class="promo-label">Hubungi Kami</h2>
        <div class="split-layout">
            <div class="contact-info">
                <h3>📞 Customer Service</h3>
                <p>WhatsApp: <a href="+62 858-9656-6486" target="_blank">+62 858-9656-6486</a></p>
                <p>Email: cs@wikearnila123@gmail.com</p>
                <p>Instagram: @wikearr_</p>
                <p>Jam Operasional: Senin - Sabtu (09.00 - 17.00)</p>
            </div>
            <div class="contact-form">
                <h3>📨 Kirim Pesan Langsung</h3>
                <form id="contactForm">
                    <div class="form-group"><label>Nama Anda</label><input type="text" id="contactName" placeholder="Nama" required></div>
                    <div class="form-group"><label>Email/WA</label><input type="text" id="contactEmail" placeholder="Email atau WhatsApp"></div>
                    <div class="form-group"><label>Pesan</label><textarea id="contactMsg" rows="4" placeholder="Tanyakan produk atau keluhan..."></textarea></div>
                    <button type="submit" class="btn-buy">Kirim Pesan</button>
                </form>
                <p style="font-size:12px; margin-top:10px;">*Pesan akan diteruskan ke admin via email.</p>
            </div>
        </div>
    </div>
</div>
<script>
    function getCart() { return JSON.parse(localStorage.getItem('cart') || '[]'); }
    function updateCartCount() {
        const cart = getCart();
        const total = cart.reduce((sum, item) => sum + item.qty, 0);
        const span = document.getElementById('cart-count');
        if (span) span.innerText = total;
    }
    document.getElementById('contactForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        alert("Terima kasih! Pesan Anda telah terkirim. Kami akan membalas dalam 1x24 jam.");
        e.target.reset();
    });
    window.onload = updateCartCount;
    window.addEventListener('pageshow', updateCartCount);
</script>
</body>
</html
